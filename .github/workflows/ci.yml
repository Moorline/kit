name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --filter '!@moorline/package-kit'
      - name: Install package-kit runtime dependencies
        run: |
          deps_dir="$(mktemp -d)"
          npm install --prefix "$deps_dir" --ignore-scripts esbuild@0.25.12 semver@7.8.1 tar@7.5.15
          rm -rf node_modules/@esbuild node_modules/@isaacs node_modules/chownr node_modules/esbuild node_modules/minipass node_modules/minizlib node_modules/semver node_modules/tar node_modules/yallist
          cp -R "$deps_dir/node_modules/." node_modules/
          rm -rf "$deps_dir"
      - name: Build local contracts
        run: |
          node ../moorline/scripts/clean-package-dist.mjs contracts
          ./node_modules/.bin/tsc -p ../moorline/packages/contracts/tsconfig.json --typeRoots ./node_modules/@types
      - name: Link local contracts
        run: |
          mkdir -p node_modules/@moorline
          rm -rf node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" node_modules/@moorline/contracts
      - run: bun run build:packages
      - run: bun run check:fast
      - run: npm pack ./packages/package-kit

  full-gate:
    needs: fast-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --filter '!@moorline/package-kit'
      - name: Install package-kit runtime dependencies
        run: |
          deps_dir="$(mktemp -d)"
          npm install --prefix "$deps_dir" --ignore-scripts esbuild@0.25.12 semver@7.8.1 tar@7.5.15
          rm -rf node_modules/@esbuild node_modules/@isaacs node_modules/chownr node_modules/esbuild node_modules/minipass node_modules/minizlib node_modules/semver node_modules/tar node_modules/yallist
          cp -R "$deps_dir/node_modules/." node_modules/
          rm -rf "$deps_dir"
      - name: Build local contracts
        run: |
          node ../moorline/scripts/clean-package-dist.mjs contracts
          ./node_modules/.bin/tsc -p ../moorline/packages/contracts/tsconfig.json --typeRoots ./node_modules/@types
      - name: Link local contracts
        run: |
          mkdir -p node_modules/@moorline
          rm -rf node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" node_modules/@moorline/contracts
      - run: bun run check
