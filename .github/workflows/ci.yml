name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun --cwd ../moorline install --frozen-lockfile
      - run: bun --cwd ../moorline run --filter '@moorline/contracts' build
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run check:fast
      - run: npm pack ./packages/package-kit

  full-gate:
    needs: fast-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun --cwd ../moorline install --frozen-lockfile
      - run: bun --cwd ../moorline run --filter '@moorline/contracts' build
      - run: bun install --frozen-lockfile
      - run: bun run check
